# HPC config for u8023272 — real TalkBank layout.
#
# IMPORTANT: two separate trees.
#   transcripts (.cha)  -> data_root   (download separately, see DATA_SETUP.md)
#   audio (.mp3)        -> audio.media_root  (your media.talkbank.org tree)
# They are linked by filename stem (002-0.cha  <->  002-0.mp3).

# Transcripts: ~/media.talkbank.org/transcripts/{dementia,fluency}/...
# Audio (separate trees): ~/media.talkbank.org/{dementia,fluency}/... ; phon/ IGNORED.
data_root: ~/media.talkbank.org/transcripts
out_root:  ~/VoiceAgent/artifacts

corpora:
  # One corpus per DementiaBank language (7). The parser recurses; group comes
  # from @ID or the Control/Dementia folder; task (cookie/recall/...) from the
  # folder above each file. speaker key includes language, so identical stems
  # across languages never merge.
  # 'lang' is a fallback used only if a file's @Languages header is missing.
  # Taiwanese code is 'nan' (Min Nan) — preserved via safe CSV reading.
  Dem_English:   {path: dementia/English,   population: dementia, speaker_regex: '^(?P<sid>\d+)', lang: eng}
  # keep_langs drops stray-language files (437 eng-tagged utts w/ 0 markers,
  # 0 timestamps sat in German). Verify with diagnose_index's example-file line
  # first, then trust the allowlist.
  Dem_German:    {path: dementia/German,    population: dementia, speaker_regex: '^(?P<sid>\d+)', lang: deu, keep_langs: [deu]}
  # Greek Dem@Care is MULTI-PARTY (PAR0..PARn per file = group conversation).
  # Handled automatically: each PARn is a distinct session-scoped speaker.
  # CAVEAT: the folder dx (AD/HC/MCI) is applied to every participant, but some
  # PARn are caregivers/facilitators, not patients — use 0demo.xlsx to assign
  # per-speaker dx before any known-groups claim on Greek. Rich in repair.
  Dem_Greek:     {path: dementia/Greek,     population: dementia, speaker_regex: '^(?P<sid>\d+)', lang: ell}
  Dem_Korean:    {path: dementia/Korean,    population: dementia, speaker_regex: '^(?P<sid>\d+)', lang: kor}
  Dem_Mandarin:  {path: dementia/Mandarin,  population: dementia, speaker_regex: '^(?P<sid>\d+)', lang: zho}
  # Spanish is TWO very different sub-corpora — split for clean per-corpus stats:
  #  Ivanova = Don Quixote recall monologue (single PAR, spa)
  #  PerLA   = multi-party FAMILY conversation (HIJ/MAR/MUJ tiers), spa + Catalan
  Dem_Spanish_Ivanova: {path: dementia/Spanish/Ivanova, population: dementia, speaker_regex: '^(?P<sid>.+)$', lang: spa}
  Dem_Spanish_PerLA:   {path: dementia/Spanish/PerLA,   population: dementia, speaker_regex: '^(?P<sid>\d+)'}
  # Taiwanese (Lu): media 'unlinked' -> NO timestamps, no %mor, romanized Min Nan.
  # Audio+gold only; needs forced alignment before any audio work. keep_langs
  # drops a stray single Mandarin-tagged file. 17 files.
  Dem_Taiwanese: {path: dementia/Taiwanese, population: dementia, speaker_regex: '^(?P<sid>\d+)', lang: nan, keep_langs: [nan]}
  # FluencyBank Voices-AWS: tasks = interview/, reading/; audio is .mp4.
  # Leading-number speaker regex is conservative (merges 24fb/24fc rather than
  # risk leakage); refine with Voices-AWS metadata later.
  FluencyBank:   {path: fluency/Voices-AWS, population: fluency,  speaker_regex: '^(?P<sid>\d+)'}

splits:
  seed: 13
  test_frac: 0.2
  dev_frac: 0.1
  min_speakers_zero_shot: 8

labels:
  target: silver_pdi          # -> gold_rating once annotation lands
  gold_dir: ~/VoiceAgent/labels

audio:
  media_root:                                  # two audio trees; phon/ deliberately excluded
    - ~/media.talkbank.org/dementia            # .mp3
    - ~/media.talkbank.org/fluency             # .mp4 (video -> audio extracted)
  wav_cache:  ~/VoiceAgent/wav16k              # 16k mono cache (preprocess.py fills it)
  sample_rate: 16000
  max_segment_s: 20.0

ssl:
  model: facebook/wav2vec2-xls-r-300m
  layer: 18                    # per-layer probe peak (scripts/probe_layers.py)
  pool: mean
  batch_size: 8

train:
  target: silver_pdi
  epochs: 20
  lr: 1.0e-4
  batch_size: 32
  adv_language_weight: 0.1
  adv_population_weight: 0.1
  adv_speaker_weight: 0.0
  grl_gamma: 10.0
