data_root: tests/multi/transcripts
out_root: tests/multi/artifacts
corpora:
  Dem_English:  {path: dementia/English,  population: dementia, speaker_regex: '^(?P<sid>\d+)'}
  Dem_German:   {path: dementia/German,   population: dementia, speaker_regex: '^(?P<sid>\d+)'}
  Dem_Mandarin: {path: dementia/Mandarin, population: dementia, speaker_regex: '^(?P<sid>\d+)'}
  FluencyBank:  {path: fluency/Voices-AWS, population: fluency,  speaker_regex: '^(?P<sid>\d+)'}
splits: {seed: 13, test_frac: 0.25, dev_frac: 0.1, min_speakers_zero_shot: 4}
labels: {target: silver_pdi, gold_dir: tests/multi/gold}
audio:
  media_root: [tests/multi/dementia, tests/multi/fluency]
  wav_cache: ""
  sample_rate: 16000
  max_segment_s: 20.0
ssl: {model: x, layer: 12, pool: mean, batch_size: 8}
train: {target: silver_pdi, epochs: 3, lr: 1.0e-4, batch_size: 32, adv_language_weight: 0.1, adv_population_weight: 0.1, adv_speaker_weight: 0.0, grl_gamma: 10.0}
